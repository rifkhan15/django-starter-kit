{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}


{% block content %}
<form method="post">
  {% csrf_token %}

  <div class="content-subtitle">
    <h4>Creating new {{ model_verbose_name }}</h4>

    {% if not has_formset %}
    <button class="check-char" type="submit" title="Save"">
      ✔
    </button>
    {% endif %}

    <a class="cancel-char" title="Cancel" href="{% url list_url %}">✖</a>
  </div>

  {{ form.as_p }}

  {% if has_formset %}
  <button class="add-lineitem" type="submit" title="Add inquiry items">
    + {{ formset_verbose_name_plural }}
  </button>
  {% endif %}

</form>

{% endblock %}
