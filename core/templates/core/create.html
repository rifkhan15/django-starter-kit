{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}


{% block content %}
<div class="form-div">
  <form id="core-form" method="post">
    {% csrf_token %}

      {% include 'core/partials/_form.html' %}

      {% if has_formset %}
      <button class="add-lineitem" type="submit" title="Add inquiry items">
        + {{ formset_verbose_name_plural }}
      </button>
      {% endif %}

  </form>
</div>
{% endblock %}
