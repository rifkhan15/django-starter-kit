{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}


{% block content %}

<h4 class="content-subtitle">Creating new {{ model_verbose_name }}</h4>

<form method="post">
{% csrf_token %}

<button type="submit">
  {% if has_formset %}
  Save & Add {{ formset_verbose_name_plural }}
  {% else %}
  Save
  {% endif %}
</button>

<a href="{% url list_url %}">Cancel</a>

  {{ form.as_p }} 

</form>

{% endblock %}
