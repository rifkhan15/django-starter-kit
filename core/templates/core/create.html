{% extends 'base.html' %}

{% block content %}

<h3>Creating new {{ model_verbose_name }}</h3>

<form method="post">
{% csrf_token %}

<button type="submit">
  {% if has_formset %}
  Save & Add {{ formset_verbose_name_plural }}
  {% else %}
  Save
  {% endif %}
</button>

<a href="{% url list_url %}">Cancel</a>

  {{ form.as_p }} 

  {% if formset %}
  {{ formset.management_form }}

  {% for f in formset %}
  {{ f.as_p }}
  {% endfor %}
  {% endif %}

</form>

{% endblock %}
