<table>
    <tbody>
        <tr>
            <td>{{ formset_verbose_name_plural|capfirst }}</td>
            <td>:</td>
            {% for field in formset.0.visible_fields %}
            <td>{{ field.label }}</td>
            {% endfor %}
        </tr>
        {% for f in formset %}
        {% for hidden in f.hidden_fields %}
        {{ hidden }}
        {% endfor %}
        <tr>
            <td></td>
            <td></td>
            {% for field in f.visible_fields %}
            <td>{{ field }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
