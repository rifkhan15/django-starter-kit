{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/pagination.css' %}">
{% endblock %}

<div class="pagination">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}&q={{ search_query }}">&lt;</a>
    {% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}&q={{ search_query }}">&gt;</a>
    {% endif %}
</div>
