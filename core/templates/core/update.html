{% extends 'base.html' %}

{% block content %}

<form method="post">
  {% csrf_token %}

  <div class="content-subtitle">
    <h4>Editing {{ view.model_verbose_name }} "{{ object }}"</h4>
    <button class="check-char" type="submit" title="Save">✔</button>
    <a class="cancel-char" title="Close" href="{% url list_url %}">✖</a>
  </div>

  {{ form.as_p }}

  {% if formset %}
  {{ formset.management_form }}

  {% for f in formset %}
  {{ f.as_p }}
  {% endfor %}
  {% endif %}

</form>


{% endblock %}
