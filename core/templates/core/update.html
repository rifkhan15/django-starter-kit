{% extends 'base.html' %}

{% block content %}

<h4 class="content-subtitle">Editing {{ view.model_verbose_name }} "{{ object }}"</h4>

<form method="post">
{% csrf_token %}

<button type="submit">Save</button>

<a href="{% url list_url %}">Cancel</a>

  {{ form.as_p }} 

  {% if formset %}
  {{ formset.management_form }}

  {% for f in formset %}
  {{ f.as_p }}
  {% endfor %}
  {% endif %}

</form>


{% endblock %}
