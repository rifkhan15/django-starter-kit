{% extends 'base.html' %}

{% block content %}

<h3>Editing {{ view.model_verbose_name }} "{{ object }}"</h3>

<form method="post">
   <button type="submit">{% if formset %}Save{% else %}Add {{ formset_verbose_name_plural }}{% endif %}</button>
  <a href="javascript:history.back()">Cancel</a>

  {% csrf_token %}

  {{ form.as_p }} 

  {% if formset %}
  {{ formset.management_form }}

  {% for f in formset %}
  {{ f.as_p }}
  {% endfor %}
  {% endif %}
 
</form>

{% endblock %}
