{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}


{% block content %}
<div class="content-div">
  <form id="core-form" method="post">
    {% csrf_token %}

    <div class="form-div">
      {% include 'core/partials/_form.html' %}

      {% if formset %}
      {{ formset.management_form }}
      {% include 'core/partials/_formset.html' %}
      {% endif %}
    </div>

  </form>
</div>
{% endblock %}
