{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}


{% block content %}
<div class="content-div">
<form id="core-form" method="post">
  {% csrf_token %}

  <div class="form-div">
    {% include 'core/partials/_form.html' %}
  </div>
  <!-- {{ form.as_p }} -->

  {% if formset %}
  {{ formset.management_form }}

  {% for form in formset %}

  {{ form.as_p }}

  {% endfor %}
  {% endif %}

</form>
</div>
{% endblock %}
