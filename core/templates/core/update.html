{% extends 'base.html' %}

{% block content %}

<h3>Editing {{ view.model_verbose_name }} "{{ object }}"</h3>

<form method="post">
  <button type="submit">Save</button>

<a href="{% url list_url %}">Cancel</a>

  {{ form.as_p }} 

  {% if formset %}
  {{ formset.management_form }}

  {% for f in formset %}
  {{ f.as_p }}
  {% endfor %}
  {% endif %}

</form>

{% endblock %}
