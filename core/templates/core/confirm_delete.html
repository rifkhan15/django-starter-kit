{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/core.css' %}">
{% endblock %}

{% block content %}

<div class="content-div">
    <h4 class="main-subtitle">Are you sure to delete?</h4>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes</button>
        <a href="javascript:history.back()">Cancel</a>
    </form>
</div>

{% endblock %}
