<form method="post">
  {% csrf_token %}

  {{ form.as_p }}

  {% if formset %}
    {{ formset.management_form }}

    {% for f in formset %}
      {{ f.as_p }}
    {% endfor %}
  {% endif %}

  <button type="submit">{% if formset %}Save{% else %}Add items{% endif %}</button>

  <a href="javascript:history.back()">Cancel</a>
</form>
