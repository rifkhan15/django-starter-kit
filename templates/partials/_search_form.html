{% load static %}
<form class="search-form" method="get">
    <input type="text" name="q" value="{{ search_query }}" placeholder="Search">
    {% if not search_query %}
    <button type="submit">Search</button>
    {% else %}
    <a href="?">Clear Search</a>
    {% endif %}
</form>

{% block extra_css %}
<link rel="stylesheet" href="{% static 'search_form.css' %}">
{% endblock %}
