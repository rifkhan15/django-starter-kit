<h4  class="content-subtitle">
{% if page_obj.has_previous %}
    <a href="?page=1&q={{ search_query }}">First</a>
    <a href="?page={{ page_obj.previous_page_number }}&q={{ search_query }}">
        Previous
    </a>
{% endif %}

Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}

{% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}&q={{ search_query }}">
        Next
    </a>
    <a href="?page={{ page_obj.paginator.num_pages }}&q={{ search_query }}">
        Last
    </a>
{% endif %}
</h4>
